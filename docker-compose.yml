# =========================================================
#  Production docker-compose
#  Использование:
#    1. cp .env_example .env
#    2. docker compose run --rm server -init-secrets
#    3. docker compose run --rm server -create-admin
#    4. docker compose up -d
# =========================================================

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ignition
    restart: unless-stopped
    ports:
      - "8200:8200"
    env_file:
      - .env
    environment:
      FIRMWARES_DIR: /app/data/firmwares
      FLASHERS_DIR: /app/data/flashers
      DB_DIR: /app/data/db
      LISTEN_ADDR: 0.0.0.0:8200
    volumes:
      # Прямое монтирование локальных файлов/папок
      - ./database.sqlite3:/app/data/db/database.sqlite3
      - ./firmwares:/app/data/firmwares
      - ./flashers:/app/data/flashers
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8200/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

